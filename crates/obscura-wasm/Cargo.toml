[package]
name = "obscura-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable Obscura core for JavaScript-hosted WebAssembly runtimes."
publish = false

[features]
default = []
# Node supplies V8 and resource bytes; the complete layout, raster paint, and
# PNG encoder remain inside the portable module.
render = ["dep:obscura-render", "obscura-render/paint"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = { workspace = true }
html5ever = { workspace = true }
js-sys = "0.3"
obscura-dom = { workspace = true }
obscura-platform = { workspace = true }
obscura-render = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
