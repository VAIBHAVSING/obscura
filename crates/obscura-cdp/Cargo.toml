[package]
name = "obscura-cdp"
version.workspace = true
edition.workspace = true

[features]
default = ["native-server"]
# Transport-free surface for the portable/WASM CDP implementation. The
# legacy native dispatcher and server are deliberately not part of this
# feature; they are enabled explicitly through `native-engine` and
# `native-server` below while the domain handlers are migrated.
portable = []
# Keep the existing Page/BrowserContext based CDP implementation available as
# a separately selectable adapter. This feature has no socket or listener
# dependencies, so embedders can reuse the native engine without the server.
native-engine = [
    "dep:obscura-browser",
    "dep:obscura-js",
    "dep:obscura-net",
    "dep:tokio",
    "dep:uuid",
]
# Legacy TCP/WebSocket transport. Pulling this feature also pulls the engine
# because server.rs owns native Pages and dispatches through CdpContext.
native-server = [
    "native-engine",
    "dep:tokio-tungstenite",
    "dep:futures-util",
]
# Enable Page.captureScreenshot via obscura-render. Propagates render to
# obscura-browser so Page::screenshot is available.
render = [
    "native-engine",
    "obscura-browser/render",
    "dep:image",
    "dep:png",
]

[dependencies]
obscura-dom = { workspace = true }
obscura-browser = { workspace = true, optional = true }
obscura-js = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, optional = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
futures-util = { version = "0.3", optional = true }
obscura-net = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
png = { version = "0.18", optional = true }

[target.'cfg(target_env = "gnu")'.dependencies]
libc = "0.2"

# Existing integration tests exercise the native Page/BrowserContext adapter.
# Keep them out of the transport-free portable test graph; protocol/action
# unit tests remain available under the portable feature.
